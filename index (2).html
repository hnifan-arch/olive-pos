<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>有橄生活收銀</title>
<style>
  /* 單一淺色系：攤位白天戶外使用，固定淺色以利日光下閱讀 */
  :root{color-scheme:light;--leaf:#4E5B2C;--leaf-deep:#2F3818;--sage:#E6EAD9;--paper:#F7F8F2;--oil:#C9A227;--oil-soft:#F3E7B8;--pit:#5B3A4B;--line:#C8CEB4;--ink:#22281A}
  *{box-sizing:border-box}
  html,body{background:#F7F8F2}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-tap-highlight-color:transparent}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;background:var(--leaf-deep);color:#fff;flex-wrap:wrap}
  header h1{margin:0;font-size:20px;letter-spacing:.04em}
  header h1 span{color:var(--oil)}
  nav{margin-left:auto;display:flex;gap:6px}
  nav button{background:transparent;color:#DCE3C4;border:1px solid #5E6B3A;border-radius:999px;padding:8px 16px;font-size:15px;cursor:pointer}
  nav button.on{background:var(--oil);color:var(--leaf-deep);border-color:var(--oil);font-weight:700}
  main{display:none;padding:18px}
  main.on{display:block}
  .pos{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
  @media (max-width:820px){.pos{grid-template-columns:1fr}}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .group{font-size:15px;color:#5F6848;margin:4px 0 8px}
  .item{background:var(--sage);border:2px solid transparent;border-radius:16px 16px 16px 4px;padding:14px;text-align:left;cursor:pointer;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;font:inherit;color:inherit}
  .item.combo{background:var(--oil-soft)}
  .item:active{border-color:var(--leaf);transform:scale(.98)}
  .item b{font-size:17px;line-height:1.3}
  .item small{color:#6A7152;font-size:13px}
  .item i{font-style:normal;font-size:22px;font-weight:700;color:var(--leaf)}
  .cart{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;position:sticky;top:12px}
  .cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .cart-head h2{margin:0;font-size:17px}
  .newbtn{background:var(--sage);border:none;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;color:var(--leaf-deep);cursor:pointer}
  .row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:16px}
  .row .n{flex:1}
  .row .n small{display:block;color:#6A7152;font-size:13px}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:18px;cursor:pointer}
  .empty{color:#7A8263;padding:18px 0;text-align:center}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 10px}
  .total strong{font-size:40px;color:var(--leaf-deep)}
  .pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pay button{padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer}
  .cash{background:var(--leaf);color:#fff;grid-column:1/-1}
  .epay{background:var(--sage);color:var(--leaf-deep)}
  .pay button:disabled{opacity:.35}
  dialog{border:none;border-radius:22px;padding:22px;width:min(460px,94vw);background:var(--paper)}
  dialog::backdrop{background:rgba(34,40,26,.55)}
  dialog h3{margin:0 0 6px;font-size:19px}
  .due{font-size:30px;font-weight:700;color:var(--leaf-deep);margin-bottom:12px}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .quick button{padding:14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
  .change{background:var(--leaf-deep);color:#fff;border-radius:14px;padding:14px;margin:12px 0;display:flex;justify-content:space-between;align-items:baseline}
  .change strong{font-size:34px;color:var(--oil)}
  .acts{display:flex;gap:8px;margin-top:12px}
  .acts button{flex:1;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer}
  .ok{background:var(--oil);color:var(--leaf-deep)}
  .ok:disabled{opacity:.4}
  .no{background:var(--sage);color:var(--ink)}
  .picks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:46vh;overflow:auto}
  .pick{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
  .pick .c{display:flex;align-items:center;gap:6px}
  .pick button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:17px;cursor:pointer}
  .pick.has{border-color:var(--leaf);background:var(--sage)}
  .progress{font-size:16px;margin:4px 0 12px;color:var(--leaf-deep);font-weight:700}
  .done{text-align:center}
  .done .big{font-size:24px;font-weight:700;margin:6px 0 4px}
  .done p{color:#5F6848;margin:0 0 6px}
  input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;font-size:17px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--sage);border-radius:16px;padding:16px}
  .stat small{display:block;color:#5F6848;font-size:14px}
  .stat b{font-size:28px;color:var(--leaf-deep)}
  table{width:100%;border-collapse:collapse;background:#fff}
  th,td{padding:11px;text-align:left;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
  th{background:var(--leaf);color:#fff;font-weight:600}
  .r{text-align:right}
  section h2{font-size:18px;margin:20px 0 10px}
  .edit{display:grid;grid-template-columns:1fr 110px 96px 46px;gap:8px;margin-bottom:8px;align-items:center}
  .edit.cb{grid-template-columns:1fr 90px 110px 46px}
  .edit label{font-size:14px;display:flex;align-items:center;gap:4px}
  .edit label input{width:auto}
  .hint{font-size:14px;color:#5F6848;margin:0 0 10px}
  .del{height:46px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--pit);font-size:18px;cursor:pointer}
  .btn{padding:12px 18px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;background:var(--leaf);color:#fff;margin-right:8px;margin-top:8px}
  .btn.ghost{background:var(--sage);color:var(--leaf-deep)}
  .btn.warn{background:#fff;color:var(--pit);border:1px solid var(--pit)}
  .delsale{padding:8px 12px;border-radius:10px;border:1px solid var(--pit);background:#fff;color:var(--pit);font-size:14px;cursor:pointer}
  .who{display:flex;align-items:center;gap:8px;font-size:15px;color:#DCE3C4}
  .who select{font:inherit;font-size:16px;padding:6px 10px;border-radius:10px;border:none;background:var(--oil);color:var(--leaf-deep);font-weight:700}
  #daily tr.pick-day{cursor:pointer}
  #daily tr.sel td{background:var(--oil-soft);font-weight:700}
  #daily tr.sum td{background:var(--sage);font-weight:700}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--leaf-deep);color:#fff;padding:12px 22px;border-radius:999px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  button:focus-visible{outline:3px solid var(--oil);outline-offset:2px}
</style>
</head>
<body>


<header>
  <h1>有橄生活 <span>收銀</span></h1>
  <label class="who">經手人 <select id="staffSel"></select></label>
  <nav>
    <button data-tab="pos" class="on">收銀</button>
    <button data-tab="report">銷售報表</button>
    <button data-tab="setup">品項設定</button>
  </nav>
</header>

<main id="pos" class="on">
  <div class="pos">
    <div>
      <div class="group">組合優惠（點了選口味）</div>
      <div class="grid" id="comboGrid"></div>
      <div class="group">單包</div>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="cart">
      <div class="cart-head"><h2 id="orderNo">第 1 單</h2><button class="newbtn" id="newOrder">清空，重開一單</button></div>
      <div id="lines"></div>
      <div class="total"><span>合計</span><strong id="sum">$0</strong></div>
      <div class="pay">
        <button class="cash" data-pay="現金">現金結帳</button>
        <button class="epay" data-pay="LINE Pay">LINE Pay</button>
        <button class="epay" data-pay="街口">街口</button>
        <button class="epay" data-pay="台灣Pay">台灣Pay</button>
        <button class="epay" data-pay="其他">其他</button>
      </div>
    </aside>
  </div>
</main>

<main id="report">
  <section>
    <h2 style="margin-top:0">每日業績</h2>
    <p class="hint">點任一天可查看當天明細。</p>
    <table id="daily"></table>
    <button class="btn ghost" id="exportDaily">複製每日業績 CSV</button>
  </section>
  <section>
    <h2 id="dayTitle"></h2>
    <div class="stats" id="stats"></div>
  </section>
  <section><h2>各員工業績</h2><table id="byStaff"></table></section>
  <section><h2>各口味賣出包數（含組合）</h2><table id="byItem"></table></section>
  <section><h2>交易紀錄</h2><table id="log"></table></section>
  <button class="btn ghost" id="exportCsv">複製這天明細 CSV</button>
  <button class="btn warn" id="resetDay">刪除這天全部紀錄</button>
</main>

<main id="setup">
  <section>
    <h2>單包品項</h2>
    <p class="hint">勾「可組合」的口味，才會出現在組合的選單裡。</p>
    <div id="editList"></div>
    <button class="btn ghost" id="addItem">新增品項</button>
  </section>
  <section>
    <h2>組合優惠</h2>
    <p class="hint">設定「幾包、多少錢」，結帳時會跳出口味選單。</p>
    <div id="editCombos"></div>
    <button class="btn ghost" id="addCombo">新增組合</button>
  </section>
  <section>
    <h2>員工</h2>
    <p class="hint">結帳前在上方選「經手人」，每筆交易都會記錄是誰賣的。</p>
    <div id="editStaff"></div>
    <button class="btn ghost" id="addStaff">新增員工</button>
  </section>
  <button class="btn" id="saveAll">儲存設定</button>
  <button class="btn warn" id="resetDefault">還原預設品項</button>
</main>

<dialog id="pickDlg">
  <h3 id="pickTitle"></h3>
  <div class="progress" id="pickProg"></div>
  <div class="picks" id="picks"></div>
  <div class="acts"><button class="no" id="pickCancel">取消</button><button class="ok" id="pickOk" disabled>加入這一單</button></div>
</dialog>

<dialog id="cashDlg">
  <h3>現金收款</h3>
  <div class="due" id="cashDue"></div>
  <input id="cashIn" type="number" inputmode="numeric" placeholder="客人給多少">
  <div class="quick" id="quick"></div>
  <div class="change"><span>找零</span><strong id="chg">—</strong></div>
  <div class="acts"><button class="no" id="cashCancel">取消</button><button class="ok" id="cashOk">完成結帳</button></div>
</dialog>

<dialog id="epayDlg">
  <h3 id="epayTitle"></h3>
  <div class="due" id="epayDue"></div>
  <p>請客人掃碼付款，確認入帳後再按完成。</p>
  <div class="acts"><button class="no" id="epayCancel">取消</button><button class="ok" id="epayOk">已收到款項</button></div>
</dialog>

<dialog id="doneDlg" class="done">
  <div class="big" id="doneTitle">結帳完成</div>
  <p id="doneSub"></p>
  <div class="acts"><button class="no" id="undoLast">打錯了，刪除這單</button><button class="ok" id="nextOrder">開始下一單</button></div>
</dialog>

<dialog id="askDlg">
  <h3 id="askTitle"></h3>
  <p id="askBody" style="white-space:pre-line;margin:0"></p>
  <textarea id="askText" hidden readonly style="width:100%;height:180px;font-size:13px;margin-top:8px"></textarea>
  <div class="acts"><button class="no" id="askNo">取消</button><button class="ok" id="askYes">確定</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
// 有橄生活官網單包定價（2026/10 查詢），可在「品項設定」修改
const DEFAULT_ITEMS = [
  {id:'okra',  name:'純味秋葵 40g',     price:169, combo:true},
  {id:'bean',  name:'純味敏豆 40g',     price:169, combo:true},
  {id:'broc',  name:'純味青花椰 50g',   price:169, combo:true},
  {id:'sp',    name:'原切地瓜片 50g',   price:149, combo:true},
  {id:'sps',   name:'原切地瓜條 60g',   price:149, combo:true},
  {id:'pur',   name:'原切紫地瓜片 50g', price:149, combo:true},
  {id:'pump',  name:'原切南瓜片 50g',   price:149, combo:true},
  {id:'pot',   name:'原切馬鈴薯片 50g', price:149, combo:true},
  {id:'pots',  name:'原切馬鈴薯條 60g', price:149, combo:true},
  {id:'carr',  name:'原切胡蘿蔔片 50g', price:169, combo:true},
  {id:'beet',  name:'原切甜菜根片 30g', price:169, combo:true},
  {id:'taro',  name:'原切芋頭條 60g',   price:199, combo:false},
  {id:'zuc',   name:'原切櫛瓜片 40g',   price:199, combo:false},
];
const DEFAULT_COMBOS = [
  {id:'c2', name:'任選 2 包', count:2, price:300},
  {id:'c3', name:'任選 3 包', count:3, price:440},
];
const DEFAULT_STAFF=['我','員工1','員工2','員工3'];
const K_ITEMS='olive-items-v2', K_COMBOS='olive-combos-v2', K_STAFF='olive-staff-v1', K_CUR='olive-curstaff-v1', K_DAYS='olive-days-v1';
const dayKey=(d=new Date())=>{ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); };
let curDate=dayKey(), days=[], viewDate=curDate, viewSales=[];
let items=[], combos=[], sales=[], cart=[], payMethod='', staff=[], curStaff='';
const $=id=>document.getElementById(id);
const money=n=>'$'+Number(n).toLocaleString('zh-TW');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

// 資料存在這台裝置的瀏覽器（localStorage）
let db=null;
const docId=k=>k.replace(/[^A-Za-z0-9_-]/g,'_');
function lsGet(k){ try{ const v=localStorage.getItem(k); return v==null?undefined:JSON.parse(v); }catch(e){ return undefined; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
async function getKey(k,fallback){
  if(db){ try{ const snap=await db.collection('pos').doc(docId(k)).get(); if(snap.exists){ const d=snap.data(); return d&&d.v!==undefined?clone(d.v):fallback; } }catch(e){} }
  const l=lsGet(k); return l===undefined?fallback:l;
}
async function setKey(k,v){
  lsSet(k,v);
  if(!db){ return; }
  try{ await db.collection('pos').doc(docId(k)).set({v:clone(v)}); }
  catch(e){}
}
function ask(title,body,yes='確定'){
  return new Promise(res=>{
    $('askTitle').textContent=title; $('askBody').textContent=body||''; $('askText').hidden=true;
    $('askNo').hidden=false; $('askYes').textContent=yes;
    $('askYes').onclick=()=>{ $('askDlg').close(); res(true); };
    $('askNo').onclick=()=>{ $('askDlg').close(); res(false); };
    $('askDlg').showModal();
  });
}
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

async function load(){
  renderAll();
  // GitHub 版：資料只存在這台裝置的瀏覽器，每天記得複製 CSV 備份
  items=await getKey(K_ITEMS,clone(DEFAULT_ITEMS));
  combos=await getKey(K_COMBOS,clone(DEFAULT_COMBOS));
  days=await getKey(K_DAYS,[]);
  sales=await getKey('olive-day:'+curDate,[]);
  staff=await getKey(K_STAFF,DEFAULT_STAFF.slice());
  curStaff=await getKey(K_CUR,staff[0]);
  if(!staff.includes(curStaff)) curStaff=staff[0];
  renderAll();
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('main').forEach(m=>m.classList.toggle('on',m.id===b.dataset.tab));
  if(b.dataset.tab==='report') renderReport();
  if(b.dataset.tab==='setup') renderSetup();
});

/* ---------- 收銀 ---------- */
function renderGrid(){
  $('comboGrid').innerHTML=combos.map(c=>`<button class="item combo" data-c="${c.id}"><span><b>${esc(c.name)}</b><br><small>可混搭口味</small></span><i>${money(c.price)}</i></button>`).join('');
  $('comboGrid').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>openPicker(combos.find(c=>c.id===b.dataset.c)));
  $('grid').innerHTML=items.map(i=>`<button class="item" data-id="${i.id}"><b>${esc(i.name)}</b><i>${money(i.price)}</i></button>`).join('');
  $('grid').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>addSingle(b.dataset.id));
}
function addSingle(id){
  const it=items.find(i=>i.id===id);
  const line=cart.find(l=>l.type==='single'&&l.id===id);
  if(line) line.qty++; else cart.push({type:'single',id,name:it.name,price:it.price,qty:1});
  renderCart();
}
function cartTotal(){ return cart.reduce((s,l)=>s+l.price*l.qty,0); }
function renderCart(){
  $('orderNo').textContent='第 '+(sales.length+1)+' 單';
  $('lines').innerHTML=cart.length?cart.map((l,k)=>{
    if(l.type==='combo'){
      return `<div class="row"><span class="n">${esc(l.name)}<small>${l.picks.map(p=>esc(p.name)+(p.qty>1?'×'+p.qty:'')).join('、')}</small></span><span class="qty"><button data-rm="${k}" aria-label="移除">×</button></span><span>${money(l.price)}</span></div>`;
    }
    return `<div class="row"><span class="n">${esc(l.name)}</span><span class="qty"><button data-m="${k}">−</button>${l.qty}<button data-p="${k}">＋</button></span><span>${money(l.price*l.qty)}</span></div>`;
  }).join(''):'<div class="empty">點左邊品項加入</div>';
  $('lines').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const l=cart[b.dataset.m]; l.qty--; if(l.qty<=0) cart.splice(b.dataset.m,1); renderCart(); });
  $('lines').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ cart[b.dataset.p].qty++; renderCart(); });
  $('lines').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ cart.splice(b.dataset.rm,1); renderCart(); });
  const t=cartTotal(); $('sum').textContent=money(t);
  document.querySelectorAll('.pay button').forEach(b=>b.disabled=t===0);
}
$('newOrder').onclick=async()=>{ if(cart.length && !(await ask('清空目前這一單？','購物車裡的品項會全部移除。','清空'))) return; cart=[]; renderCart(); };

/* ---------- 組合選口味 ---------- */
let pickCombo=null, pickState={};
function openPicker(c){
  pickCombo=c; pickState={};
  $('pickTitle').textContent=c.name+'　'+money(c.price);
  drawPicks(); $('pickDlg').showModal();
}
function drawPicks(){
  const n=Object.values(pickState).reduce((a,b)=>a+b,0), need=pickCombo.count;
  $('pickProg').textContent=`已選 ${n} / ${need} 包`;
  $('pickOk').disabled=n!==need;
  const pool=items.filter(i=>i.combo);
  $('picks').innerHTML=pool.map(i=>{ const q=pickState[i.id]||0;
    return `<div class="pick${q?' has':''}"><span>${esc(i.name)}</span><span class="c"><button data-pm="${i.id}">−</button>${q}<button data-pp="${i.id}">＋</button></span></div>`;}).join('');
  $('picks').querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{ if(n>=need){ toast('已選滿 '+need+' 包'); return; } pickState[b.dataset.pp]=(pickState[b.dataset.pp]||0)+1; drawPicks(); });
  $('picks').querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{ if(pickState[b.dataset.pm]){ pickState[b.dataset.pm]--; if(!pickState[b.dataset.pm]) delete pickState[b.dataset.pm]; drawPicks(); } });
}
$('pickCancel').onclick=()=>$('pickDlg').close();
$('pickOk').onclick=()=>{
  const picks=Object.entries(pickState).map(([id,qty])=>({id,name:items.find(i=>i.id===id).name,qty}));
  cart.push({type:'combo',id:pickCombo.id,name:pickCombo.name,price:pickCombo.price,qty:1,picks});
  $('pickDlg').close(); renderCart();
};

/* ---------- 結帳 ---------- */
document.querySelectorAll('.pay button').forEach(b=>b.onclick=()=>{
  payMethod=b.dataset.pay; const t=cartTotal(); if(!t) return;
  if(payMethod==='現金'){
    $('cashDue').textContent='應收 '+money(t); $('cashIn').value=''; $('chg').textContent='—';
    const opts=[...new Set([t,Math.ceil(t/100)*100,Math.ceil(t/500)*500,500,1000,2000].filter(v=>v>=t))].slice(0,6);
    $('quick').innerHTML=opts.map(v=>`<button data-v="${v}">${v===t?'剛好':money(v)}</button>`).join('');
    $('quick').querySelectorAll('button').forEach(q=>q.onclick=()=>{ $('cashIn').value=q.dataset.v; calcChange(); });
    $('cashDlg').showModal();
  } else {
    $('epayTitle').textContent=payMethod+' 收款'; $('epayDue').textContent='應收 '+money(t); $('epayDlg').showModal();
  }
});
function calcChange(){ const t=cartTotal(),g=Number($('cashIn').value); $('chg').textContent=g>=t?money(g-t):(g?'還差 '+money(t-g):'—'); }
$('cashIn').oninput=calcChange;
$('cashCancel').onclick=()=>$('cashDlg').close();
$('epayCancel').onclick=()=>$('epayDlg').close();
$('cashOk').onclick=()=>{ const g=Number($('cashIn').value||0); if(g&&g<cartTotal()){ toast('收款金額不足'); return; } $('cashDlg').close(); checkout(g?g-cartTotal():null); };
$('epayOk').onclick=()=>{ $('epayDlg').close(); checkout(null); };

async function ensureToday(){
  const d=dayKey(); if(d!==curDate){ curDate=d; sales=await getKey('olive-day:'+d,[]); }
}
async function checkout(change){
  await ensureToday();
  const total=cartTotal();
  sales.push({time:new Date().toISOString(),method:payMethod,total,staff:curStaff,lines:clone(cart)});
  cart=[];
  $('doneTitle').textContent='第 '+sales.length+' 單完成　'+money(total);
  $('doneSub').textContent=curStaff+'　'+payMethod+(change?'　找零 '+money(change):'');
  renderCart(); $('doneDlg').showModal();
  await saveDay(curDate,sales);
}
$('nextOrder').onclick=()=>$('doneDlg').close();
$('undoLast').onclick=async()=>{
  const last=sales.pop(); cart=clone(last.lines);
  await saveDay(curDate,sales); $('doneDlg').close(); renderCart(); toast('已刪除，品項放回購物車，可修改後重新結帳');
};

/* ---------- 報表 ---------- */
function packsOf(arr){ return arr.reduce((t,x)=>t+x.lines.reduce((a,l)=>a+(l.type==='combo'?l.picks.reduce((b,p)=>b+p.qty,0)*l.qty:l.qty),0),0); }
async function saveDay(date,arr){
  await setKey('olive-day:'+date,arr);
  days=days.filter(d=>d.date!==date);
  if(arr.length) days.push({date,total:arr.reduce((a,x)=>a+x.total,0),n:arr.length,packs:packsOf(arr)});
  days.sort((a,b)=>b.date.localeCompare(a.date));
  await setKey(K_DAYS,days);
}
function wk(d){ return '日一二三四五六'[new Date(d+'T00:00:00').getDay()]; }
function flavorCounts(arr){
  const agg={};
  arr.forEach(s=>s.lines.forEach(l=>{
    if(l.type==='combo') l.picks.forEach(p=>agg[p.name]=(agg[p.name]||0)+p.qty*l.qty);
    else agg[l.name]=(agg[l.name]||0)+l.qty;
  }));
  return agg;
}
function lineText(l){ return l.type==='combo'?`${esc(l.name)}（${l.picks.map(p=>esc(p.name)+(p.qty>1?'×'+p.qty:'')).join('、')}）`:`${esc(l.name)}×${l.qty}`; }
async function renderReport(date){
  await ensureToday();
  if(date) viewDate=date;
  viewSales = viewDate===curDate ? sales : await getKey('olive-day:'+viewDate,[]);
  // 每日業績
  const list=days.slice();
  if(!list.find(d=>d.date===curDate)) list.unshift({date:curDate,total:0,n:0,packs:0});
  const T=list.reduce((a,d)=>({t:a.t+d.total,n:a.n+d.n,p:a.p+d.packs}),{t:0,n:0,p:0});
  $('daily').innerHTML='<tr><th>日期</th><th class="r">營收</th><th class="r">筆數</th><th class="r">包數</th><th class="r">客單價</th></tr>'+
    list.map(d=>`<tr class="pick-day${d.date===viewDate?' sel':''}" data-day="${d.date}"><td>${d.date.slice(5).replace('-','/')}（${wk(d.date)}）${d.date===curDate?'今天':''}</td><td class="r">${money(d.total)}</td><td class="r">${d.n}</td><td class="r">${d.packs}</td><td class="r">${money(d.n?Math.round(d.total/d.n):0)}</td></tr>`).join('')+
    `<tr class="sum"><td>累計 ${list.filter(d=>d.n).length} 天</td><td class="r">${money(T.t)}</td><td class="r">${T.n}</td><td class="r">${T.p}</td><td class="r">${money(T.n?Math.round(T.t/T.n):0)}</td></tr>`;
  $('daily').querySelectorAll('[data-day]').forEach(r=>r.onclick=()=>renderReport(r.dataset.day));
  // 當天明細
  const arr=viewSales;
  $('dayTitle').textContent=viewDate.replace(/-/g,'/')+'（'+wk(viewDate)+'）'+(viewDate===curDate?' 今天':'')+' 明細';
  const total=arr.reduce((s,x)=>s+x.total,0);
  const agg=flavorCounts(arr); const packs=Object.values(agg).reduce((a,b)=>a+b,0);
  const byMethod={}; arr.forEach(s=>byMethod[s.method]=(byMethod[s.method]||0)+s.total);
  $('stats').innerHTML=
    `<div class="stat"><small>營收</small><b>${money(total)}</b></div>`+
    `<div class="stat"><small>交易筆數</small><b>${arr.length}</b></div>`+
    `<div class="stat"><small>賣出包數</small><b>${packs}</b></div>`+
    `<div class="stat"><small>客單價</small><b>${money(arr.length?Math.round(total/arr.length):0)}</b></div>`+
    Object.entries(byMethod).map(([m,v])=>`<div class="stat"><small>${esc(m)}</small><b>${money(v)}</b></div>`).join('');
  const bs={}; arr.forEach(s=>{ const k=s.staff||'未指定'; bs[k]=bs[k]||{n:0,v:0,p:0}; bs[k].n++; bs[k].v+=s.total; bs[k].p+=packsOf([s]); });
  const sr=Object.entries(bs).sort((a,b)=>b[1].v-a[1].v);
  $('byStaff').innerHTML='<tr><th>員工</th><th class="r">筆數</th><th class="r">包數</th><th class="r">營收</th></tr>'+(sr.length?sr.map(([n,a])=>`<tr><td>${esc(n)}</td><td class="r">${a.n}</td><td class="r">${a.p}</td><td class="r">${money(a.v)}</td></tr>`).join(''):'<tr><td colspan="4">這天沒有銷售紀錄</td></tr>');
  const rows=Object.entries(agg).sort((a,b)=>b[1]-a[1]);
  $('byItem').innerHTML='<tr><th>口味</th><th class="r">包數</th></tr>'+(rows.length?rows.map(([n,q])=>`<tr><td>${esc(n)}</td><td class="r">${q}</td></tr>`).join(''):'<tr><td colspan="2">這天沒有銷售紀錄</td></tr>');
  $('log').innerHTML='<tr><th>#</th><th>時間</th><th>經手</th><th>內容</th><th>付款</th><th class="r">金額</th><th></th></tr>'+
    (arr.length?arr.map((s,i)=>({s,i})).reverse().map(({s,i})=>`<tr><td>${i+1}</td><td>${new Date(s.time).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</td><td>${esc(s.staff||'—')}</td><td>${s.lines.map(lineText).join('<br>')}</td><td>${esc(s.method)}</td><td class="r">${money(s.total)}</td><td><button class="delsale" data-ds="${i}">刪除</button></td></tr>`).join(''):'<tr><td colspan="7">這天沒有交易</td></tr>');
  $('log').querySelectorAll('[data-ds]').forEach(b=>b.onclick=async()=>{
    const i=Number(b.dataset.ds), x=arr[i];
    if(!(await ask('刪除這一單？',`${x.lines.map(l=>l.type==='combo'?l.name+'（'+l.picks.map(p=>p.name+(p.qty>1?'×'+p.qty:'')).join('、')+'）':l.name+'×'+l.qty).join('\n')}\n${x.method} ${money(x.total)}`,'刪除'))) return;
    arr.splice(i,1); await saveDay(viewDate,arr); renderReport(); renderCart(); toast('已刪除這一單');
  });
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast('已複製，可貼到試算表'); }
  catch(e){
    $('askTitle').textContent='手動複製'; $('askBody').textContent='長按下方文字，全選後複製。';
    $('askText').value=txt; $('askText').hidden=false; $('askNo').hidden=true; $('askYes').textContent='關閉';
    $('askYes').onclick=()=>$('askDlg').close(); $('askDlg').showModal(); $('askText').select();
  }
}
$('exportCsv').onclick=()=>{
  const rows=['日期,單號,時間,經手人,品項,口味,包數,金額,付款方式'];
  viewSales.forEach((s,i)=>s.lines.forEach(l=>{
    const t=new Date(s.time).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    if(l.type==='combo') l.picks.forEach((p,j)=>rows.push([viewDate,i+1,t,s.staff||'',l.name,p.name,p.qty,j===0?l.price:0,s.method].join(',')));
    else rows.push([viewDate,i+1,t,s.staff||'','單包',l.name,l.qty,l.price*l.qty,s.method].join(','));
  }));
  copyText(rows.join('\n'));
};
$('exportDaily').onclick=()=>{
  const rows=['日期,星期,營收,筆數,包數,客單價'].concat(days.slice().reverse().map(d=>[d.date,wk(d.date),d.total,d.n,d.packs,d.n?Math.round(d.total/d.n):0].join(',')));
  copyText(rows.join('\n'));
};
$('resetDay').onclick=async()=>{
  if(!(await ask(`刪除 ${viewDate} 的全部紀錄？`,'刪除後無法復原，建議先複製 CSV 備份。','全部刪除'))) return;
  viewSales.length=0; await saveDay(viewDate,viewSales); renderReport(); renderCart(); toast('已刪除這天紀錄');
};

/* ---------- 設定 ---------- */
let dItems=[], dCombos=[], dStaff=[];
function renderSetup(){ dItems=clone(items); dCombos=clone(combos); dStaff=staff.slice(); drawSetup(); }
function drawSetup(){
  $('editList').innerHTML=dItems.map((i,k)=>`<div class="edit"><input data-k="${k}" data-f="name" value="${esc(i.name)}" placeholder="品名"><input data-k="${k}" data-f="price" type="number" inputmode="numeric" value="${i.price}" placeholder="價格"><label><input type="checkbox" data-k="${k}" data-f="combo" ${i.combo?'checked':''}>可組合</label><button class="del" data-di="${k}" aria-label="刪除">×</button></div>`).join('');
  $('editCombos').innerHTML=dCombos.map((c,k)=>`<div class="edit cb"><input data-ck="${k}" data-f="name" value="${esc(c.name)}" placeholder="名稱"><input data-ck="${k}" data-f="count" type="number" inputmode="numeric" value="${c.count}" placeholder="幾包"><input data-ck="${k}" data-f="price" type="number" inputmode="numeric" value="${c.price}" placeholder="組合價"><button class="del" data-dc="${k}" aria-label="刪除">×</button></div>`).join('');
  $('editStaff').innerHTML=dStaff.map((n,k)=>`<div class="edit" style="grid-template-columns:1fr 46px"><input data-sk="${k}" value="${esc(n)}" placeholder="員工名字"><button class="del" data-dst="${k}" aria-label="刪除">×</button></div>`).join('');
  $('editStaff').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ dStaff[inp.dataset.sk]=inp.value; });
  $('editStaff').querySelectorAll('[data-dst]').forEach(b=>b.onclick=()=>{ dStaff.splice(b.dataset.dst,1); drawSetup(); });
  $('editList').querySelectorAll('input').forEach(inp=>inp.oninput=inp.onchange=()=>{ const d=dItems[inp.dataset.k],f=inp.dataset.f; d[f]=f==='combo'?inp.checked:(f==='price'?Number(inp.value):inp.value); });
  $('editCombos').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ const d=dCombos[inp.dataset.ck],f=inp.dataset.f; d[f]=f==='name'?inp.value:Number(inp.value); });
  $('editList').querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>{ dItems.splice(b.dataset.di,1); drawSetup(); });
  $('editCombos').querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{ dCombos.splice(b.dataset.dc,1); drawSetup(); });
}
$('addItem').onclick=()=>{ dItems.push({id:'i'+Date.now(),name:'',price:0,combo:true}); drawSetup(); };
$('addStaff').onclick=()=>{ dStaff.push(''); drawSetup(); };
$('addCombo').onclick=()=>{ dCombos.push({id:'c'+Date.now(),name:'',count:2,price:0}); drawSetup(); };
$('saveAll').onclick=async()=>{
  const ci=dItems.filter(i=>i.name.trim()&&i.price>0), cc=dCombos.filter(c=>c.name.trim()&&c.count>0&&c.price>0);
  if(!ci.length){ toast('至少要有一個品項'); return; }
  const cs=[...new Set(dStaff.map(n=>n.trim()).filter(Boolean))];
  if(!cs.length){ toast('至少要有一位員工'); return; }
  items=ci; combos=cc; staff=cs; cart=[];
  if(!staff.includes(curStaff)) curStaff=staff[0];
  await setKey(K_ITEMS,items); await setKey(K_COMBOS,combos); await setKey(K_STAFF,staff); await setKey(K_CUR,curStaff);
  renderAll(); toast('已儲存設定');
};
$('resetDefault').onclick=async()=>{ if(!(await ask('還原預設品項與組合？','不影響銷售紀錄。按「還原」後記得再按儲存設定。','還原'))) return; dItems=clone(DEFAULT_ITEMS); dCombos=clone(DEFAULT_COMBOS); drawSetup(); toast('已還原，記得按儲存'); };

function renderStaffSel(){
  $('staffSel').innerHTML=staff.map(n=>`<option ${n===curStaff?'selected':''}>${esc(n)}</option>`).join('');
}
$('staffSel').onchange=async e=>{ curStaff=e.target.value; toast('經手人：'+curStaff); await setKey(K_CUR,curStaff); };
function renderAll(){ renderGrid(); renderCart(); renderStaffSel(); }
load();
</script>
